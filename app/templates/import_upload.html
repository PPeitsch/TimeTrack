{% extends "base.html" %}

{% block title %}Import Time Data{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="bi bi-cloud-upload me-2"></i>Import Time Data</h4>
            </div>
            <div class="card-body">
                <p class="card-text text-muted mb-4">
                    Upload your time report file here. Supported formats: <strong>PDF, Excel (xlsx, xls)</strong>.
                    <br>
                    The system attempts to parse Date, Entry Time, Exit Time, and Observations.
                </p>

                <form method="POST" enctype="multipart/form-data">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-4">
                        <label for="file" class="form-label">Select File</label>
                        <input class="form-control form-control-lg" type="file" id="file" name="file" accept=".pdf,.xlsx,.xls">
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-file-earmark-arrow-up me-2"></i>Upload and Preview
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
